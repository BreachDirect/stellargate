# Example StellarGate config. Copy to stellargate.yaml and adjust paths.

target: .
fail_on: high   # critical | high | medium | low

tools:
  rytscan:
    enabled: true
    path: ./contracts

  schemalock:
    enabled: true
    config: ./schemalock.yaml
    base_url: http://127.0.0.1:8000

  vaultsweep:
    enabled: true
    path: .
    # Optional: glob patterns (fnmatch) for known-false-positive paths to
    # exclude from the scan, e.g. test fixtures with intentionally fake
    # secrets. Example: ignore_paths: ["tests/fixtures/**", "**/*.example"]

  shieldscan:
    enabled: false   # Phase 2 — adapter not implemented yet
