[project]
name = "stellargate"
version = "0.1.0"
description = "Unified Stellar DevSecOps Gate — orchestrates RytScan, SchemaLock, VaultSweep, and (Phase 2) ShieldScan into one compliance report."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=24.0",
    "ruff>=0.6",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[project.scripts]
stellargate = "stellargate.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
