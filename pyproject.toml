[project]
name = "stellargate"
version = "0.1.0"
description = "Unified Stellar DevSecOps Gate — orchestrates RytScan, SchemaLock, VaultSweep, and (Phase 2) ShieldScan into one compliance report."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.coverage.run]
source = ["stellargate"]
omit = ["tests/*", "*/tests/*"]

[project.scripts]
stellargate = "stellargate.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
